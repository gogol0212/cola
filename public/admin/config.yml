locale: zh_Hans
site_url: https://www.fangzhongda.com
display_url: https://www.fangzhongda.com
logo_url: https://www.fangzhongda.com/assets/logo.png
publish_mode: editorial_workflow
show_preview_links: true

backend:
  name: github
  repo: gogol0212/cola
  branch: main
  base_url: https://fangzhongda-decap-auth.gogol0212.workers.dev
  auth_endpoint: /auth
  preview_context: cloudflare-pages
  commit_messages:
    create: "内容：新增 {{collection}} / {{slug}}"
    update: "内容：更新 {{collection}} / {{slug}}"
    delete: "内容：删除 {{collection}} / {{slug}}"
    uploadMedia: "素材：上传 {{path}}"
    deleteMedia: "素材：删除 {{path}}"

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: products
    label: 产品知识库
    label_singular: 产品页面
    folder: src/content/products
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt, sortOrder]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 产品名称, name: title, widget: string }
      - { label: 页面路径, name: slug, widget: string, hint: "使用英文小写和连字符，例如 youtongxing" }
      - label: 产品分类
        name: category
        widget: select
        options:
          - { label: 儿童保险, value: children }
          - { label: 医疗保险, value: medical }
          - { label: 重疾保险, value: critical-illness }
          - { label: 储蓄保险, value: savings }
          - { label: 养老规划, value: pension }
          - { label: 海外资产配置, value: overseas-assets }
      - { label: 一句话定位, name: summary, widget: text }
      - { label: 适合人群, name: audience, widget: list, field: { label: 人群, name: item, widget: string } }
      - label: 保障类别
        name: productLine
        widget: select
        options:
          - { label: 健康保障, value: health }
          - { label: 意外保障, value: accident }
          - { label: 重疾保障, value: critical-illness }
          - { label: 享老保障, value: retirement }
          - { label: 财富管理, value: wealth }
          - { label: 传世系列, value: legacy }
      - label: 适用人群筛选
        name: audiences
        widget: select
        multiple: true
        options:
          - { label: 成人, value: adult }
          - { label: 儿童, value: child }
      - { label: 友邦官网产品链接, name: officialUrl, widget: string, required: false, hint: "如引用友邦官网资料，请填写对应公开页面。" }
      - { label: 封面图片, name: heroImage, widget: image, required: false }
      - label: 客户痛点
        name: painPoints
        widget: list
        required: false
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: text, widget: text }
      - label: 核心优势
        name: highlights
        widget: list
        required: false
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: text, widget: text }
      - label: 保障内容
        name: coverage
        widget: list
        required: false
        fields:
          - { label: 责任名称, name: title, widget: string }
          - { label: 核心数字或短句, name: value, widget: string }
          - { label: 责任说明, name: text, widget: text }
      - label: 生活案例
        name: cases
        widget: list
        required: false
        fields:
          - { label: 案例标题, name: title, widget: string }
          - { label: 生活场景, name: scenario, widget: string }
          - { label: 结果说明, name: result, widget: text }
          - { label: 案例图片, name: image, widget: image, required: false }
      - label: 产品比较
        name: comparison
        widget: list
        required: false
        fields:
          - { label: 比较维度, name: label, widget: string }
          - { label: 本产品, name: product, widget: text }
          - { label: 市场常见方案, name: market, widget: text }
      - label: 常见问题
        name: faq
        widget: list
        required: false
        fields:
          - { label: 问题, name: question, widget: string }
          - { label: 回答, name: answer, widget: text }
      - { label: 咨询区标题, name: ctaTitle, widget: string, default: 预约一对一咨询 }
      - { label: 咨询区说明, name: ctaText, widget: text, default: 获得适合家庭实际情况的保障梳理。 }
      - { label: 咨询二维码, name: qrImage, widget: image, required: false }
      - { label: 是否精选, name: featured, widget: boolean, default: false }
      - label: 发布状态
        name: status
        widget: select
        default: draft
        options:
          - { label: 草稿, value: draft }
          - { label: 已审核, value: reviewed }
          - { label: 已发布, value: published }
      - { label: 排序, name: sortOrder, widget: number, value_type: int, default: 100 }
      - { label: 内容更新日期, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: 适用地区, name: region, widget: string, default: 中国大陆 }
      - { label: SEO 标题, name: seoTitle, widget: string }
      - { label: SEO 描述, name: seoDescription, widget: text }
      - { label: 补充正文, name: body, widget: markdown, required: false }

  - name: aia_catalog
    label: 友邦官网产品索引
    files:
      - label: 产品索引
        name: products
        file: src/data/aia-products.json
        fields:
          - { label: 官网核验日期, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
          - label: 产品列表
            name: products
            widget: list
            summary: "{{fields.title}} · {{fields.productLine}}"
            fields:
              - { label: 产品名称, name: title, widget: string }
              - label: 保障类别
                name: productLine
                widget: select
                options:
                  - { label: 健康保障, value: health }
                  - { label: 意外保障, value: accident }
                  - { label: 重疾保障, value: critical-illness }
                  - { label: 享老保障, value: retirement }
                  - { label: 财富管理, value: wealth }
                  - { label: 传世系列, value: legacy }
              - label: 适用人群
                name: audiences
                widget: select
                multiple: true
                options:
                  - { label: 成人, value: adult }
                  - { label: 儿童, value: child }
              - { label: 简短说明, name: summary, widget: text }
              - { label: 友邦官网链接, name: officialUrl, widget: string }

  - name: team
    label: 团队资料
    files:
      - label: 团队成员
        name: members
        file: src/data/team.json
        fields:
          - label: 成员列表
            name: members
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { label: 姓名, name: name, widget: string }
              - { label: 学校与学历, name: school, widget: string }
              - { label: 专业经历, name: role, widget: string }
              - { label: 公司年限, name: years, widget: string }
              - { label: 照片路径, name: image, widget: string }

  - name: settings
    label: 网站设置
    files:
      - label: 基础资料
        name: site
        file: src/content/settings/site.yml
        fields:
          - { label: 网站名称, name: siteName, widget: string }
          - { label: 团队名称, name: teamName, widget: string }
          - { label: 团队理念, name: principle, widget: text }
          - { label: 顾问姓名, name: advisorName, widget: string }
          - { label: 咨询链接, name: contactUrl, widget: string }
          - { label: 合规提示, name: disclaimer, widget: text }
