locale: zh_Hans
site_url: https://architecture-phase-0-1.cola-dr4.pages.dev
display_url: https://architecture-phase-0-1.cola-dr4.pages.dev
logo_url: https://architecture-phase-0-1.cola-dr4.pages.dev/assets/logo.png
publish_mode: editorial_workflow
show_preview_links: true

backend:
  name: github
  repo: gogol0212/cola
  branch: architecture/phase-0-1
  base_url: https://fangzhongda-decap-auth.gogol0212.workers.dev
  auth_endpoint: /auth
  preview_context: cloudflare-pages
  commit_messages:
    create: "内容：新增 {{collection}} / {{slug}}"
    update: "内容：更新 {{collection}} / {{slug}}"
    delete: "内容：删除 {{collection}} / {{slug}}"
    uploadMedia: "素材：上传 {{path}}"
    deleteMedia: "素材：删除 {{path}}"

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: knowledge
    label: 保险知识
    label_singular: 知识文章
    folder: src/content/knowledge
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 文章标题, name: title, widget: string }
      - {
          label: 页面路径,
          name: slug,
          widget: string,
          hint: "使用英文小写和连字符，例如 hubei-medical-insurance",
        }
      - label: 内容分类
        name: category
        widget: select
        options:
          - { label: 医保政策, value: medical-policy }
          - { label: 保险选购, value: insurance-selection }
          - { label: 医疗与理赔, value: claims }
          - { label: 健康知识, value: health }
          - { label: 家庭规划, value: family-planning }
      - { label: 列表摘要, name: summary, widget: text }
      - { label: 封面图片, name: coverImage, widget: image, required: false }
      - { label: 首页精选, name: featured, widget: boolean, default: false }
      - {
          label: 内容状态,
          name: status,
          widget: select,
          default: draft,
          options: [draft, reviewed, published],
        }
      - {
          label: 更新日期,
          name: updatedAt,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
        }
      - { label: SEO标题, name: seoTitle, widget: string }
      - { label: SEO描述, name: seoDescription, widget: text }
      - {
          label: 发布主体,
          name: authorLabel,
          widget: string,
          default: 未来可乐团队,
        }
      - { label: 正文, name: body, widget: markdown }
      - { label: 资料来源, name: sourceText, widget: text, required: false }
      - {
          label: 阅读说明,
          name: disclaimer,
          widget: text,
          default: "本文仅用于保险及健康知识交流，不构成诊断、治疗、投保建议或销售承诺。",
        }

  - name: products
    label: 产品介绍
    label_singular: 产品页面
    folder: src/content/products
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt, sortOrder]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 产品名称, name: title, widget: string }
      - {
          label: 页面路径,
          name: slug,
          widget: string,
          required: false,
          hint: "使用英文小写和连字符，例如 youtongxing",
        }
      - label: 产品分类
        name: category
        widget: select
        required: false
        options:
          - { label: 儿童保险, value: children }
          - { label: 医疗保险, value: medical }
          - { label: 重疾保险, value: critical-illness }
          - { label: 储蓄保险, value: savings }
          - { label: 养老规划, value: pension }
          - { label: 海外资产配置, value: overseas-assets }
      - { label: 一句话定位, name: summary, widget: text, required: false }
      - {
          label: 适合人群,
          name: audience,
          widget: list,
          required: false,
          field: { label: 人群, name: item, widget: string },
        }
      - label: 保障类别
        name: productLines
        widget: select
        multiple: true
        required: false
        hint: "可多选，例如同时选择健康保障和意外保障。"
        options:
          - { label: 健康保障, value: health }
          - { label: 意外保障, value: accident }
          - { label: 重疾保障, value: critical-illness }
          - { label: 享老保障, value: retirement }
          - { label: 财富管理, value: wealth }
          - { label: 传世系列, value: legacy }
      - label: 适用人群筛选
        name: audiences
        widget: select
        multiple: true
        required: false
        options:
          - { label: 成人, value: adult }
          - { label: 儿童, value: child }
      - {
          label: 友邦官网产品链接,
          name: officialUrl,
          widget: string,
          required: false,
          hint: "如引用友邦官网资料，请填写对应公开页面。",
        }
      - {
          label: 封面图片,
          name: heroImage,
          widget: image,
          required: false,
          hint: "最佳尺寸：桌面版 4:5 竖版（如 1000×1250px），移动版 16:11（如 1600×1100px）。建议按 4:5 竖版为主、图片四周留白。",
        }
      - {
          label: 封面图片显示区域,
          name: heroImagePosition,
          widget: select,
          required: false,
          default: center,
          options:
            [
              { label: 居中（默认）, value: center },
              { label: 顶部居中, value: "top center" },
              { label: 底部居中, value: "bottom center" },
              { label: 左上, value: "left top" },
              { label: 左中, value: "left center" },
              { label: 左下, value: "left bottom" },
              { label: 右上, value: "right top" },
              { label: 右中, value: "right center" },
              { label: 右下, value: "right bottom" },
            ],
        }
      - { label: 是否精选, name: featured, widget: boolean, required: false, default: false }
      - label: 发布状态
        name: status
        widget: select
        default: draft
        options:
          - { label: 草稿, value: draft }
          - { label: 已审核, value: reviewed }
          - { label: 已发布, value: published }
      - { label: 排序值, name: sortOrder, widget: number, default: 100 }
      - {
          label: 资料更新日期,
          name: updatedAt,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
        }
      - { label: 适用地区, name: region, widget: string, required: false }
      - { label: SEO 标题, name: seoTitle, widget: string, required: false }
      - { label: SEO 描述, name: seoDescription, widget: text, required: false }
      - { label: 补充正文, name: body, widget: markdown, required: false }


  - name: aia_catalog
    label: 友邦官网产品索引
    files:
      - label: 产品索引
        name: products
        file: src/data/aia-products.json
        fields:
          - {
              label: 官网核验日期,
              name: updatedAt,
              widget: datetime,
              date_format: YYYY-MM-DD,
              time_format: false,
            }
          - label: 产品列表
            name: products
            widget: list
            summary: "{{fields.title}} · {{fields.productLines}}"
            fields:
              - { label: 产品名称, name: title, widget: string }
              - label: 保障类别
                name: productLines
                widget: select
                multiple: true
                options:
                  - { label: 健康保障, value: health }
                  - { label: 意外保障, value: accident }
                  - { label: 重疾保障, value: critical-illness }
                  - { label: 享老保障, value: retirement }
                  - { label: 财富管理, value: wealth }
                  - { label: 传世系列, value: legacy }
              - label: 适用人群
                name: audiences
                widget: select
                multiple: true
                options:
                  - { label: 成人, value: adult }
                  - { label: 儿童, value: child }
              - { label: 简短说明, name: summary, widget: text }
              - { label: 友邦官网链接, name: officialUrl, widget: string }

  - name: team
    label: 团队资料
    files:
      - label: 团队成员
        name: members
        file: src/data/team.json
        fields:
          - label: 成员列表
            name: members
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { label: 姓名, name: name, widget: string }
              - { label: 学校与学历, name: school, widget: string }
              - { label: 专业经历, name: role, widget: string }
              - { label: 公司年限, name: years, widget: string }
              - { label: 照片路径, name: image, widget: string }
      - label: 团队页面内容
        name: teamSite
        file: src/data/team-site.json
        fields:
          - label: 首页 Hero
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 主标题, name: headline, widget: string }
              - { label: 主标题强调词, name: headlineAccent, widget: string }
              - { label: 副标题, name: subheadline, widget: string }
              - { label: 中文口号, name: slogan, widget: string }
              - { label: 英文口号, name: sloganEn, widget: string }
              - label: 标签
                name: tags
                widget: list
                field: { label: 标签, name: item, widget: string }
          - label: 团队信念
            name: belief
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - label: 段落
                name: paragraphs
                widget: list
                field: { label: 段落, name: item, widget: text }
          - label: 关于友邦·百年里程碑
            name: aia
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: text }
              - { label: 数据来源说明, name: note, widget: text }
              - label: 里程碑
                name: milestones
                widget: list
                label_singular: 里程碑
                summary: "{{fields.year}} · {{fields.title}}"
                fields:
                  - { label: 年份, name: year, widget: string }
                  - { label: 标题, name: title, widget: string }
                  - { label: 说明, name: desc, widget: text }
                  - { label: 图片, name: image, widget: image }
          - label: 核心数据
            name: stats
            widget: list
            label_singular: 数据项
            summary: "{{fields.value}} · {{fields.label}}"
            fields:
              - { label: 数值, name: value, widget: string }
              - { label: 标签, name: label, widget: string }
              - { label: 说明, name: note, widget: string }
          - label: 创始人
            name: founder
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 姓名, name: name, widget: string }
              - { label: 学校与学历, name: school, widget: string }
              - { label: 入司年限, name: years, widget: string }
              - { label: 角色, name: role, widget: string }
              - { label: 照片路径, name: image, widget: string }
              - { label: 一句话定位, name: tagline, widget: text }
              - label: 经历段落
                name: paragraphs
                widget: list
                field: { label: 段落, name: item, widget: text }
              - label: 亮点
                name: highlights
                widget: list
                summary: "{{fields.label}} · {{fields.value}}"
                fields:
                  - { label: 标签, name: label, widget: string }
                  - { label: 数值, name: value, widget: string }
          - label: 团队成员区块
            name: members
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: lead, widget: text }
              - { label: 虚位以待标题, name: vacancyTitle, widget: string }
              - { label: 虚位以待副标题, name: vacancySub, widget: string }
          - label: 专业认可
            name: recognition
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: lead, widget: text }
              - label: 认可列表
                name: items
                widget: list
                field: { label: 认可, name: item, widget: string }
          - label: Be Best 人才计划
            name: beBest
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - label: 津贴卡片
                name: cards
                widget: list
                label_singular: 卡片
                summary: "{{fields.period}} · {{fields.amount}}"
                fields:
                  - { label: 阶段, name: period, widget: string }
                  - { label: 金额, name: amount, widget: string }
                  - { label: 单位, name: unit, widget: string }
                  - { label: 说明, name: desc, widget: text }
              - label: 招募条件
                name: conditions
                widget: list
                field: { label: 条件, name: item, widget: string }
              - { label: 免责说明, name: note, widget: text }
              - { label: CTA 文案, name: ctaText, widget: string }
          - label: 未来企业家计划
            name: entrepreneur
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - { label: 统一条件说明（如天生赢家测评）, name: assessment, widget: string }
              - label: 三大计划
                name: plans
                widget: list
                label_singular: 计划
                summary: "{{fields.name}} · 津贴 {{fields.stipend}}"
                fields:
                  - { label: 计划名, name: name, widget: string }
                  - { label: 定位, name: subname, widget: string }
                  - { label: 津贴, name: stipend, widget: string }
                  - { label: 单位, name: unit, widget: string }
                  - { label: 首三月收入, name: first3m, widget: string }
                  - { label: 首十二月收入, name: first12m, widget: string }
                  - label: 招募条件
                    name: conditions
                    widget: list
                    field: { label: 条件, name: item, widget: string }
                  - { label: 是否重点推荐, name: featured, widget: boolean, default: false }
              - label: 统一赋能体系
                name: support
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string }
                  - label: 板块
                    name: blocks
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: 标题, name: title, widget: string }
                      - label: 要点
                        name: lines
                        widget: list
                        field: { label: 要点, name: item, widget: text }
                  - { label: 免责说明, name: note, widget: text }
          - label: 招募数据
            name: recruitment
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 导语, name: lead, widget: text }
              - { label: 申请人数, name: applied, widget: string }
              - { label: 入职人数, name: joined, widget: string }
              - { label: 录用率, name: acceptance, widget: string }
              - label: 学历数据
                name: education
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string }
                  - { label: 大数字, name: big, widget: string }
                  - { label: 大数字标签, name: bigLabel, widget: string }
                  - label: 要点
                    name: points
                    widget: list
                    field: { label: 要点, name: item, widget: string }
              - label: 转型数据
                name: transformation
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string }
                  - { label: 大数字, name: big, widget: string }
                  - { label: 大数字标签, name: bigLabel, widget: string }
                  - label: 明细
                    name: grid
                    widget: list
                    summary: "{{fields.label}} · {{fields.value}}"
                    fields:
                      - { label: 名称, name: label, widget: string }
                      - { label: 数值, name: value, widget: string }
              - label: 友榜 YOUNG
                name: young
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string }
                  - { label: 副标题, name: subtitle, widget: string }
                  - label: 年龄分布
                    name: ageBands
                    widget: list
                    summary: "{{fields.label}} · {{fields.percent}}"
                    fields:
                      - { label: 年龄段, name: label, widget: string }
                      - { label: 人数, name: count, widget: string }
                      - { label: 占比, name: percent, widget: string }
                  - label: 指标
                    name: metrics
                    widget: list
                    summary: "{{fields.label}} · {{fields.value}}"
                    fields:
                      - { label: 名称, name: label, widget: string }
                      - { label: 数值, name: value, widget: string }
              - label: 招募来源图表
                name: sourceChart
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string }
                  - { label: 副标题, name: subtitle, widget: string }
                  - label: 行业数据
                    name: items
                    widget: list
                    summary: "{{fields.label}} · {{fields.value}}"
                    fields:
                      - { label: 行业, name: label, widget: string }
                      - { label: 占比, name: value, widget: string }
          - label: 招募 CTA
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: text, widget: text }
              - label: 加入步骤
                name: steps
                widget: list
                label_singular: 步骤
                summary: "{{fields.num}} · {{fields.title}}"
                fields:
                  - { label: 序号, name: num, widget: string }
                  - { label: 标题, name: title, widget: string }
                  - { label: 说明, name: desc, widget: string }
              - { label: 按钮文案, name: buttonText, widget: string }
              - { label: 按钮链接, name: buttonUrl, widget: string }

  - name: settings
    label: 网站设置
    files:
      - label: 基础资料
        name: site
        file: src/content/settings/site.yml
        fields:
          - { label: 网站名称, name: siteName, widget: string }
          - { label: 团队名称, name: teamName, widget: string }
          - { label: 团队理念, name: principle, widget: text }
          - { label: 顾问姓名, name: advisorName, widget: string }
          - { label: 咨询链接, name: contactUrl, widget: string }
          - { label: 合规提示, name: disclaimer, widget: text }
