locale: zh_Hans
site_url: https://www.fangzhongda.com
display_url: https://www.fangzhongda.com
logo_url: https://www.fangzhongda.com/assets/logo.png
publish_mode: editorial_workflow
show_preview_links: true

backend:
  name: github
  repo: gogol0212/cola
  branch: main
  base_url: https://fangzhongda-decap-auth.gogol0212.workers.dev
  auth_endpoint: /auth
  preview_context: cloudflare-pages
  commit_messages:
    create: "内容：新增 {{collection}} / {{slug}}"
    update: "内容：更新 {{collection}} / {{slug}}"
    delete: "内容：删除 {{collection}} / {{slug}}"
    uploadMedia: "素材：上传 {{path}}"
    deleteMedia: "素材：删除 {{path}}"

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: knowledge
    label: 保险知识
    label_singular: 知识文章
    folder: src/content/knowledge
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 文章标题, name: title, widget: string }
      - { label: 页面路径, name: slug, widget: string, hint: "使用英文小写和连字符，例如 hubei-medical-insurance" }
      - label: 内容分类
        name: category
        widget: select
        options:
          - { label: 医保政策, value: medical-policy }
          - { label: 保险选购, value: insurance-selection }
          - { label: 医疗与理赔, value: claims }
          - { label: 健康知识, value: health }
          - { label: 家庭规划, value: family-planning }
      - { label: 列表摘要, name: summary, widget: text }
      - { label: 封面图片, name: coverImage, widget: image, required: false }
      - { label: 首页精选, name: featured, widget: boolean, default: false }
      - { label: 内容状态, name: status, widget: select, default: draft, options: [draft, reviewed, published] }
      - { label: 更新日期, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: SEO标题, name: seoTitle, widget: string }
      - { label: SEO描述, name: seoDescription, widget: text }
      - { label: 发布主体, name: authorLabel, widget: string, default: 未来可乐团队 }
      - { label: 正文, name: body, widget: markdown }
      - { label: 资料来源, name: sourceText, widget: text, required: false }
      - { label: 阅读说明, name: disclaimer, widget: text, default: "本文仅用于保险及健康知识交流，不构成诊断、治疗、投保建议或销售承诺。" }

  - name: products
    label: 产品介绍
    label_singular: 产品页面
    folder: src/content/products
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt, sortOrder]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 产品名称, name: title, widget: string }
      - { label: 页面路径, name: slug, widget: string, hint: "使用英文小写和连字符，例如 youtongxing" }
      - label: 产品分类
        name: category
        widget: select
        options:
          - { label: 儿童保险, value: children }
          - { label: 医疗保险, value: medical }
          - { label: 重疾保险, value: critical-illness }
          - { label: 储蓄保险, value: savings }
          - { label: 养老规划, value: pension }
          - { label: 海外资产配置, value: overseas-assets }
      - { label: 一句话定位, name: summary, widget: text }
      - { label: 适合人群, name: audience, widget: list, field: { label: 人群, name: item, widget: string } }
      - label: 保障类别
        name: productLines
        widget: select
        multiple: true
        hint: "可多选，例如同时选择健康保障和意外保障。"
        options:
          - { label: 健康保障, value: health }
          - { label: 意外保障, value: accident }
          - { label: 重疾保障, value: critical-illness }
          - { label: 享老保障, value: retirement }
          - { label: 财富管理, value: wealth }
          - { label: 传世系列, value: legacy }
      - label: 适用人群筛选
        name: audiences
        widget: select
        multiple: true
        options:
          - { label: 成人, value: adult }
          - { label: 儿童, value: child }
      - { label: 友邦官网产品链接, name: officialUrl, widget: string, required: false, hint: "如引用友邦官网资料，请填写对应公开页面。" }
      - label: 费用模板
        name: layoutVariant
        widget: select
        default: medical
        options:
          - { label: 意外 / 医疗, value: medical }
          - { label: 重疾, value: critical }
          - { label: 财富 / 养老, value: wealth }
      - { label: 封面图片, name: heroImage, widget: image, required: false }
      - label: 意外 / 医疗费用表
        name: medicalCosts
        widget: list
        required: false
        fields:
          - { label: 责任模块, name: responsibility, widget: string }
          - { label: 限额 / 给付, name: limit, widget: string }
          - { label: 免赔口径, name: deductible, widget: string }
          - { label: 给付比例, name: ratio, widget: string }
          - { label: 说明, name: note, widget: text }
      - label: 费用卡展示方式
        name: premiumDisplayMode
        widget: select
        default: structured
        options:
          - { label: HTML 结构化卡片, value: structured }
          - { label: 仅展示图片, value: image }
          - { label: 卡片和图片同时展示, value: both }
      - { label: 费用一览原图（备用）, name: premiumImage, widget: image, required: false }
      - { label: 费用一览手机图（备用）, name: premiumImageMobile, widget: image, required: false }
      - { label: 费用图片说明, name: premiumImageAlt, widget: string, required: false }
      - label: 年龄费用卡
        name: premiumCards
        widget: list
        required: false
        fields:
          - { label: 年龄段, name: ageRange, widget: string }
          - { label: 色彩, name: tone, widget: select, default: blue, options: [{ label: AIA Blue, value: blue }, { label: AIA Salmon, value: salmon }] }
          - { label: 主险标签, name: primaryTag, widget: string }
          - { label: 主险名称, name: primaryName, widget: string }
          - { label: 主险保费, name: primaryPrice, widget: string }
          - { label: 附加险标签, name: riderTag, widget: string }
          - { label: 附加险名称, name: riderName, widget: string }
          - { label: 附加险保费, name: riderPrice, widget: string }
          - { label: 组合保费, name: total, widget: string }
      - label: 责任一览（主险 / 附加险）
        name: coveragePlans
        widget: list
        required: false
        fields:
          - { label: 方案名称, name: title, widget: string }
          - { label: 色彩, name: tone, widget: select, default: blue, options: [{ label: AIA Blue, value: blue }, { label: AIA Salmon, value: salmon }] }
          - label: 保险责任
            name: responsibilities
            widget: list
            fields:
              - { label: 序号, name: number, widget: string }
              - { label: 责任名称, name: title, widget: string }
              - { label: 责任说明, name: text, widget: text }
              - { label: 重点提示, name: emphasis, widget: text, required: false }
              - label: 给付比例卡
                name: rates
                widget: list
                required: false
                fields:
                  - { label: 名称, name: label, widget: string }
                  - { label: 说明, name: note, widget: string, required: false }
                  - { label: 比例, name: rate, widget: string }
                  - { label: 色彩, name: tone, widget: select, required: false, options: [green, olive, purple] }
          - label: 补充说明
            name: extras
            widget: list
            required: false
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 内容, name: text, widget: text }
      - label: 重疾保费档位表
        name: criticalPremiums
        widget: list
        required: false
        fields:
          - { label: 保障档位, name: tier, widget: string }
          - { label: 基本保额, name: coverage, widget: string }
          - { label: 年交保费, name: premium, widget: string }
          - { label: 可选附加责任, name: riders, widget: string }
          - { label: 说明, name: note, widget: text }
      - label: 财富 / 养老利益表
        name: wealthCashflows
        widget: list
        required: false
        fields:
          - { label: 投保年龄, name: age, widget: string }
          - { label: 保费 / 保额, name: premiumCoverage, widget: string }
          - { label: 领取年龄, name: payoutAge, widget: string }
          - { label: 年金 / 满期利益, name: benefit, widget: string }
          - { label: 说明, name: note, widget: text }
      - label: 客户痛点
        name: painPoints
        widget: list
        required: false
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: text, widget: text }
      - label: 核心优势
        name: highlights
        widget: list
        required: false
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: text, widget: text }
      - label: 保障内容
        name: coverage
        widget: list
        required: false
        fields:
          - { label: 责任名称, name: title, widget: string }
          - { label: 核心数字或短句, name: value, widget: string }
          - { label: 责任说明, name: text, widget: text }
      - label: 生活案例
        name: cases
        widget: list
        required: false
        fields:
          - { label: 案例标题, name: title, widget: string }
          - { label: 生活场景, name: scenario, widget: string }
          - { label: 结果说明, name: result, widget: text }
          - { label: 案例图片, name: image, widget: image, required: false }
          - { label: 翻面标题, name: settlementHeading, widget: string, required: false, hint: "填写后，该案例可在悬停或点击时展示理赔测算。" }
          - label: 实际费用
            name: settlementExpenses
            widget: list
            required: false
            fields:
              - { label: 项目, name: label, widget: string }
              - { label: 金额, name: value, widget: string }
              - { label: 是否强调, name: accent, widget: boolean, default: false }
          - { label: 无保险栏标题, name: withoutInsuranceTitle, widget: string, required: false }
          - { label: 无保险栏明细, name: withoutInsuranceLines, widget: list, required: false, field: { label: 明细, name: line, widget: string } }
          - { label: 无保险栏合计, name: withoutInsuranceTotal, widget: string, required: false }
          - { label: 有保险栏标题, name: withInsuranceTitle, widget: string, required: false }
          - { label: 有保险栏明细, name: withInsuranceLines, widget: list, required: false, field: { label: 明细, name: line, widget: string } }
          - { label: 有保险栏合计, name: withInsuranceTotal, widget: string, required: false }
          - { label: 保障亮点, name: settlementHighlight, widget: text, required: false }
      - label: 产品比较
        name: comparison
        widget: list
        required: false
        fields:
          - { label: 比较维度, name: label, widget: string }
          - { label: 本产品, name: product, widget: text }
          - { label: 市场常见方案, name: market, widget: text }
      - label: 常见问题
        name: faq
        widget: list
        required: false
        fields:
          - { label: 问题, name: question, widget: string }
          - { label: 回答, name: answer, widget: text }
      - label: 真实理赔案例
        name: claimCases
        widget: list
        required: false
        hint: "必须取得客户授权，并隐去姓名、证件号、保单号、联系方式和医疗隐私。"
        fields:
          - { label: 案例标题, name: title, widget: string }
          - { label: 理赔背景, name: background, widget: text }
          - { label: 客户情况, name: customer, widget: text }
          - { label: 理赔结果, name: result, widget: text }
          - { label: 理赔通知书, name: documentImage, widget: image, required: false }
      - { label: 科普标题, name: knowledgeTitle, widget: string, required: false }
      - { label: 科普导语, name: knowledgeIntro, widget: text, required: false }
      - label: 科普知识点
        name: knowledgeItems
        widget: list
        required: false
        fields:
          - { label: 分类标签, name: label, widget: string }
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: text, widget: text }
      - { label: 科普补充说明, name: knowledgeNote, widget: text, required: false }
      - { label: 内容来源, name: sourceText, widget: text, default: 产品资料及保险合同责任摘要 }
      - { label: 对比口径, name: comparisonBasis, widget: text, default: 仅比较责任结构，不构成对市场全部产品的穷尽比较。 }
      - { label: 免责声明, name: disclaimer, widget: text, default: 本页面仅用于保险知识普及，具体责任与内容以正式保险合同及最新产品资料为准。 }
      - { label: 咨询区标题, name: ctaTitle, widget: string, default: 预约一对一咨询 }
      - { label: 咨询区说明, name: ctaText, widget: text, default: 获得适合家庭实际情况的保障梳理。 }
      - { label: 咨询二维码, name: qrImage, widget: image, required: false }
      - { label: 是否精选, name: featured, widget: boolean, default: false }
      - label: 发布状态
        name: status
        widget: select
        default: draft
        options:
          - { label: 草稿, value: draft }
          - { label: 已审核, value: reviewed }
          - { label: 已发布, value: published }
      - { label: 排序, name: sortOrder, widget: number, value_type: int, default: 100 }
      - { label: 内容更新日期, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: 适用地区, name: region, widget: string, default: 中国大陆 }
      - { label: SEO 标题, name: seoTitle, widget: string }
      - { label: SEO 描述, name: seoDescription, widget: text }
      - { label: 补充正文, name: body, widget: markdown, required: false }

  - name: aia_catalog
    label: 友邦官网产品索引
    files:
      - label: 产品索引
        name: products
        file: src/data/aia-products.json
        fields:
          - { label: 官网核验日期, name: updatedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
          - label: 产品列表
            name: products
            widget: list
            summary: "{{fields.title}} · {{fields.productLines}}"
            fields:
              - { label: 产品名称, name: title, widget: string }
              - label: 保障类别
                name: productLines
                widget: select
                multiple: true
                options:
                  - { label: 健康保障, value: health }
                  - { label: 意外保障, value: accident }
                  - { label: 重疾保障, value: critical-illness }
                  - { label: 享老保障, value: retirement }
                  - { label: 财富管理, value: wealth }
                  - { label: 传世系列, value: legacy }
              - label: 适用人群
                name: audiences
                widget: select
                multiple: true
                options:
                  - { label: 成人, value: adult }
                  - { label: 儿童, value: child }
              - { label: 简短说明, name: summary, widget: text }
              - { label: 友邦官网链接, name: officialUrl, widget: string }

  - name: team
    label: 团队资料
    files:
      - label: 团队成员
        name: members
        file: src/data/team.json
        fields:
          - label: 成员列表
            name: members
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { label: 姓名, name: name, widget: string }
              - { label: 学校与学历, name: school, widget: string }
              - { label: 专业经历, name: role, widget: string }
              - { label: 公司年限, name: years, widget: string }
              - { label: 照片路径, name: image, widget: string }

  - name: settings
    label: 网站设置
    files:
      - label: 基础资料
        name: site
        file: src/content/settings/site.yml
        fields:
          - { label: 网站名称, name: siteName, widget: string }
          - { label: 团队名称, name: teamName, widget: string }
          - { label: 团队理念, name: principle, widget: text }
          - { label: 顾问姓名, name: advisorName, widget: string }
          - { label: 咨询链接, name: contactUrl, widget: string }
          - { label: 合规提示, name: disclaimer, widget: text }
