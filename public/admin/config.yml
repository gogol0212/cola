locale: zh_Hans
site_url: https://architecture-phase-0-1.cola-dr4.pages.dev
display_url: https://architecture-phase-0-1.cola-dr4.pages.dev
logo_url: https://architecture-phase-0-1.cola-dr4.pages.dev/assets/logo.png
publish_mode: editorial_workflow
show_preview_links: true

backend:
  name: github
  repo: gogol0212/cola
  branch: architecture/phase-0-1
  base_url: https://fangzhongda-decap-auth.gogol0212.workers.dev
  auth_endpoint: /auth
  preview_context: cloudflare-pages
  commit_messages:
    create: "内容：新增 {{collection}} / {{slug}}"
    update: "内容：更新 {{collection}} / {{slug}}"
    delete: "内容：删除 {{collection}} / {{slug}}"
    uploadMedia: "素材：上传 {{path}}"
    deleteMedia: "素材：删除 {{path}}"

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: knowledge
    label: 保险知识
    label_singular: 知识文章
    folder: src/content/knowledge
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 文章标题, name: title, widget: string }
      - {
          label: 页面路径,
          name: slug,
          widget: string,
          hint: "使用英文小写和连字符，例如 hubei-medical-insurance",
        }
      - label: 内容分类
        name: category
        widget: select
        options:
          - { label: 医保政策, value: medical-policy }
          - { label: 保险选购, value: insurance-selection }
          - { label: 医疗与理赔, value: claims }
          - { label: 健康知识, value: health }
          - { label: 家庭规划, value: family-planning }
      - { label: 列表摘要, name: summary, widget: text }
      - { label: 封面图片, name: coverImage, widget: image, required: false }
      - { label: 首页精选, name: featured, widget: boolean, default: false }
      - {
          label: 内容状态,
          name: status,
          widget: select,
          default: draft,
          options: [draft, reviewed, published],
        }
      - {
          label: 更新日期,
          name: updatedAt,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
        }
      - { label: SEO标题, name: seoTitle, widget: string }
      - { label: SEO描述, name: seoDescription, widget: text }
      - {
          label: 发布主体,
          name: authorLabel,
          widget: string,
          default: 未来可乐团队,
        }
      - { label: 正文, name: body, widget: markdown }
      - { label: 资料来源, name: sourceText, widget: text, required: false }
      - {
          label: 阅读说明,
          name: disclaimer,
          widget: text,
          default: "本文仅用于保险及健康知识交流，不构成诊断、治疗、投保建议或销售承诺。",
        }

  - name: products
    label: 产品介绍
    label_singular: 产品页面
    folder: src/content/products
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    sortable_fields: [title, category, updatedAt, sortOrder]
    view_filters:
      - { label: 已发布, field: status, pattern: published }
      - { label: 草稿, field: status, pattern: draft }
    fields:
      - { label: 产品名称, name: title, widget: string }
      - {
          label: 页面路径,
          name: slug,
          widget: string,
          required: false,
          hint: "使用英文小写和连字符，例如 youtongxing",
        }
      - label: 产品分类
        name: category
        widget: select
        required: false
        options:
          - { label: 儿童保险, value: children }
          - { label: 医疗保险, value: medical }
          - { label: 重疾保险, value: critical-illness }
          - { label: 储蓄保险, value: savings }
          - { label: 养老规划, value: pension }
          - { label: 海外资产配置, value: overseas-assets }
      - { label: 一句话定位, name: summary, widget: text, required: false }
      - {
          label: 适合人群,
          name: audience,
          widget: list,
          required: false,
          field: { label: 人群, name: item, widget: string },
        }
      - label: 保障类别
        name: productLines
        widget: select
        multiple: true
        required: false
        hint: "可多选，例如同时选择健康保障和意外保障。"
        options:
          - { label: 健康保障, value: health }
          - { label: 意外保障, value: accident }
          - { label: 重疾保障, value: critical-illness }
          - { label: 享老保障, value: retirement }
          - { label: 财富管理, value: wealth }
          - { label: 传世系列, value: legacy }
      - label: 适用人群筛选
        name: audiences
        widget: select
        multiple: true
        required: false
        options:
          - { label: 成人, value: adult }
          - { label: 儿童, value: child }
      - {
          label: 友邦官网产品链接,
          name: officialUrl,
          widget: string,
          required: false,
          hint: "如引用友邦官网资料，请填写对应公开页面。",
        }
      - {
          label: 封面图片,
          name: heroImage,
          widget: image,
          required: false,
          hint: "最佳尺寸：桌面版 4:5 竖版（如 1000×1250px），移动版 16:11（如 1600×1100px）。建议按 4:5 竖版为主、图片四周留白。",
        }
      - {
          label: 封面图片显示区域,
          name: heroImagePosition,
          widget: select,
          required: false,
          default: center,
          options:
            [
              { label: 居中（默认）, value: center },
              { label: 顶部居中, value: "top center" },
              { label: 底部居中, value: "bottom center" },
              { label: 左上, value: "left top" },
              { label: 左中, value: "left center" },
              { label: 左下, value: "left bottom" },
              { label: 右上, value: "right top" },
              { label: 右中, value: "right center" },
              { label: 右下, value: "right bottom" },
            ],
        }
      - { label: 是否精选, name: featured, widget: boolean, required: false, default: false }
      - label: 发布状态
        name: status
        widget: select
        default: draft
        options:
          - { label: 草稿, value: draft }
          - { label: 已审核, value: reviewed }
          - { label: 已发布, value: published }
      - { label: 排序值, name: sortOrder, widget: number, default: 100 }
      - {
          label: 资料更新日期,
          name: updatedAt,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
        }
      - { label: 适用地区, name: region, widget: string, required: false }
      - { label: SEO 标题, name: seoTitle, widget: string, required: false }
      - { label: SEO 描述, name: seoDescription, widget: text, required: false }
      - { label: 补充正文, name: body, widget: markdown, required: false }


  - name: aia_catalog
    label: 友邦官网产品索引
    files:
      - label: 产品索引
        name: products
        file: src/data/aia-products.json
        fields:
          - {
              label: 官网核验日期,
              name: updatedAt,
              widget: datetime,
              date_format: YYYY-MM-DD,
              time_format: false,
            }
          - label: 产品列表
            name: products
            widget: list
            summary: "{{fields.title}} · {{fields.productLines}}"
            fields:
              - { label: 产品名称, name: title, widget: string }
              - label: 保障类别
                name: productLines
                widget: select
                multiple: true
                options:
                  - { label: 健康保障, value: health }
                  - { label: 意外保障, value: accident }
                  - { label: 重疾保障, value: critical-illness }
                  - { label: 享老保障, value: retirement }
                  - { label: 财富管理, value: wealth }
                  - { label: 传世系列, value: legacy }
              - label: 适用人群
                name: audiences
                widget: select
                multiple: true
                options:
                  - { label: 成人, value: adult }
                  - { label: 儿童, value: child }
              - { label: 简短说明, name: summary, widget: text }
              - { label: 友邦官网链接, name: officialUrl, widget: string }

  - name: team
    label: 团队资料
    files:
      - label: 团队成员
        name: members
        file: src/data/team.json
        fields:
          - label: 成员列表
            name: members
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { label: 姓名, name: name, widget: string }
              - { label: 学校与学历, name: school, widget: string }
              - { label: 专业经历, name: role, widget: string }
              - { label: 公司年限, name: years, widget: string }
              - { label: 照片路径, name: image, widget: string }

  - name: settings
    label: 网站设置
    files:
      - label: 基础资料
        name: site
        file: src/content/settings/site.yml
        fields:
          - { label: 网站名称, name: siteName, widget: string }
          - { label: 团队名称, name: teamName, widget: string }
          - { label: 团队理念, name: principle, widget: text }
          - { label: 顾问姓名, name: advisorName, widget: string }
          - { label: 咨询链接, name: contactUrl, widget: string }
          - { label: 合规提示, name: disclaimer, widget: text }
