<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="友邦传世金生2026荣耀版年金保险（分红型）">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333D47"/>
      <stop offset="0.55" stop-color="#3C4854"/>
      <stop offset="1" stop-color="#2A323B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg2)"/>
  <rect x="0" y="0" width="12" height="1500" fill="#A5915C"/>
  <circle cx="1090" cy="150" r="14" fill="#D31145"/>

  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="110" y="250" fill="#A5915C" font-size="34" font-weight="700" letter-spacing="10">享老保障 · 长期现金流</text>
    <text x="110" y="470" fill="#FFFFFF" font-size="104" font-weight="800" letter-spacing="2">传世金生</text>
    <text x="110" y="600" fill="#FFFFFF" font-size="104" font-weight="800" letter-spacing="2">2026 荣耀版</text>
    <text x="110" y="700" fill="#D3CAC3" font-size="44" font-weight="600" letter-spacing="4">分红型 · 年金保险</text>

    <text x="110" y="828" fill="#D3CAC3" font-size="34" font-weight="400">第 5 个保单年度起领取年金</text>
    <text x="110" y="880" fill="#D3CAC3" font-size="34" font-weight="400">65 岁起翻倍 · 105 岁满期返还已交保费</text>

    <g font-size="30" font-weight="700">
      <rect x="110" y="980" width="340" height="74" rx="37" fill="none" stroke="#A5915C" stroke-width="2"/>
      <text x="280" y="1028" fill="#C7BB9D" text-anchor="middle">第 5 年度起领</text>

      <rect x="480" y="980" width="290" height="74" rx="37" fill="none" stroke="#A5915C" stroke-width="2"/>
      <text x="625" y="1028" fill="#C7BB9D" text-anchor="middle">65 岁翻倍</text>

      <rect x="800" y="980" width="300" height="74" rx="37" fill="none" stroke="#A5915C" stroke-width="2"/>
      <text x="950" y="1028" fill="#C7BB9D" text-anchor="middle">万能复利</text>
    </g>

    <line x1="110" y1="1320" x2="1090" y2="1320" stroke="#5B636B" stroke-width="2"/>
    <text x="110" y="1390" fill="#A4A19B" font-size="30" letter-spacing="2">AIA 友邦人寿 · 未来可乐团队</text>
    <text x="1090" y="1390" fill="#A4A19B" font-size="26" text-anchor="end">保障知识说明 · 以保险合同为准</text>
  </g>
</svg>
